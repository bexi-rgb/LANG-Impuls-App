    <title>IMPULS Reise-Concierge · Taiwan 2026</title>
    <script>
      // iOS 26 Home-Screen-App: Viewport (auch fixed/inset-0, 100dvh) ist um die
      // Statusleiste zu kurz → Lücke unter der Bottom-Nav. Im Standalone-Modus
      // deckt die App den ganzen Bildschirm ab, also echte Bildschirmhöhe nehmen.
      (function () {
        var standalone = navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
        if (!standalone) return;
        function setH() {
          var portrait = window.innerHeight >= window.innerWidth;
          var screenH = portrait ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
          document.documentElement.style.setProperty('--app-h', Math.max(screenH, window.innerHeight) + 'px');
        }
        setH();
        window.addEventListener('resize', setH);
        window.addEventListener('orientationchange', setH);
      })();
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#c18c2f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="IMPULS" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <title>IMPULS Reise-Concierge · Taiwan 2026</title>
    <script>
      // iOS 26 Home-Screen-App: Viewport (auch fixed/inset-0, 100dvh) ist um die
      // Statusleiste zu kurz → Lücke unter der Bottom-Nav. Im Standalone-Modus
      // deckt die App den ganzen Bildschirm ab, also echte Bildschirmhöhe nehmen.
      (function () {
        var standalone = navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
        if (!standalone) return;
        function setH() {
          var portrait = window.innerHeight >= window.innerWidth;
          var screenH = portrait ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
          document.documentElement.style.setProperty('--app-h', Math.max(screenH, window.innerHeight) + 'px');
        }
        setH();
        window.addEventListener('resize', setH);
        window.addEventListener('orientationchange', setH);
      })();

      // Statusleisten-Abstand oben (--sat): iOS 26 (v.a. Safari) legt die Seite unter
      // die Statusleiste, meldet aber env(safe-area-inset-top) = 0 → Kopfzeilen und
      // Zurück-Buttons verschwinden hinter Uhrzeit/Dynamic Island. Reicht die Seite
      // praktisch bis zur vollen Bildschirmhöhe, liegt die Statusleiste zwangsläufig
      // darüber → Mindestabstand passend zur Geräteklasse erzwingen.
      (function () {
        if (!/iPhone|iPod/.test(navigator.userAgent)) return;
        function setSat() {
          var portrait = window.innerHeight >= window.innerWidth;
          var screenH = Math.max(screen.width, screen.height);
          var underStatusBar = portrait && window.innerHeight >= screenH - 40;
          var min = !underStatusBar ? 0 : screenH >= 852 ? 59 : screenH >= 812 ? 47 : 20;
          document.documentElement.style.setProperty('--sat', 'max(env(safe-area-inset-top), ' + min + 'px)');
        }
        setSat();
        window.addEventListener('resize', setSat);
        window.addEventListener('orientationchange', setSat);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
